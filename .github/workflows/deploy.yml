name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          envs: NEXT_PUBLIC_TURNSTILE_SITEKEY,TURNSTILE_SECRET_KEY,HUBSPOT_API_KEY
          script: |
            cd /var/www/delivery-group
            printf "NEXT_PUBLIC_TURNSTILE_SITEKEY=%s\nTURNSTILE_SECRET_KEY=%s\nHUBSPOT_API_KEY=%s\n" \
              "$NEXT_PUBLIC_TURNSTILE_SITEKEY" "$TURNSTILE_SECRET_KEY" "$HUBSPOT_API_KEY" > .env.local
            git pull origin main
            npm install --production=false
            npm run build
            pm2 restart dg-website
            echo "Deploy complete"
        env:
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
