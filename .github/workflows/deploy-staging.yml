name: Deploy to Staging

on:
  push:
    branches:
      - fix/111-nav-social-ogimage-visuals

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          script: |
            if [ ! -d /var/www/delivery-group-staging ]; then
              git clone https://github.com/DGJJGIT/DG.git /var/www/delivery-group-staging
            fi
            cd /var/www/delivery-group-staging
            git fetch origin
            git checkout fix/111-nav-social-ogimage-visuals
            git pull origin fix/111-nav-social-ogimage-visuals
            npm install --production=false
            npm run build
            if pm2 describe dg-staging > /dev/null 2>&1; then
              pm2 restart dg-staging
            else
              PORT=3001 pm2 start npm --name dg-staging -- start
            fi
            echo "Staging deploy complete"
