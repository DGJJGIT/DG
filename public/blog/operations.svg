<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle hex pattern -->
  <g opacity="0.03">
    <pattern id="hex" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#hex)"/>
  </g>
  <!-- Gear/cog pattern -->
  <g filter="url(#glow)">
    <!-- Large gear -->
    <g transform="translate(560, 280)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#B8962E" stroke-width="1.5" opacity="0.5"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="8" fill="#B8962E" opacity="0.4"/>
      <!-- Gear teeth -->
      <g opacity="0.5">
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(0)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(45)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(90)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(135)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(180)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(225)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(270)"/>
        <rect x="-8" y="-95" width="16" height="20" rx="2" fill="#B8962E" transform="rotate(315)"/>
      </g>
      <!-- Spokes -->
      <line x1="0" y1="-25" x2="0" y2="-60" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
      <line x1="25" y1="0" x2="60" y2="0" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="25" x2="0" y2="60" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
      <line x1="-25" y1="0" x2="-60" y2="0" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
    </g>
    <!-- Medium gear -->
    <g transform="translate(730, 200)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#B8962E" stroke-width="1" opacity="0.35"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#B8962E" stroke-width="0.8" opacity="0.25"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="5" fill="#D4AF37" opacity="0.3"/>
      <g opacity="0.35">
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(0)"/>
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(60)"/>
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(120)"/>
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(180)"/>
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(240)"/>
        <rect x="-6" y="-60" width="12" height="15" rx="2" fill="#B8962E" transform="rotate(300)"/>
      </g>
    </g>
    <!-- Small gear -->
    <g transform="translate(420, 380)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.35"/>
      <circle cx="0" cy="0" r="4" fill="#D4AF37" opacity="0.25"/>
      <g opacity="0.25">
        <rect x="-5" y="-42" width="10" height="12" rx="1" fill="#D4AF37" transform="rotate(0)"/>
        <rect x="-5" y="-42" width="10" height="12" rx="1" fill="#D4AF37" transform="rotate(72)"/>
        <rect x="-5" y="-42" width="10" height="12" rx="1" fill="#D4AF37" transform="rotate(144)"/>
        <rect x="-5" y="-42" width="10" height="12" rx="1" fill="#D4AF37" transform="rotate(216)"/>
        <rect x="-5" y="-42" width="10" height="12" rx="1" fill="#D4AF37" transform="rotate(288)"/>
      </g>
    </g>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">OPERATIONS</text>
  <rect x="550" y="575" width="100" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>