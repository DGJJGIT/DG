<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle diagonal pattern -->
  <g opacity="0.025">
    <pattern id="diag" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#diag)"/>
  </g>
  <!-- Main package box -->
  <g filter="url(#glow)" transform="translate(560, 240)">
    <!-- Box front face -->
    <path d="M-70,0 L0,-40 L100,-40 L100,60 L-70,60 Z" fill="#B8962E" opacity="0.06" stroke="#B8962E" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Box top face -->
    <path d="M-70,0 L0,-40 L100,-40 L30,0 Z" fill="#B8962E" opacity="0.1" stroke="#B8962E" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Box side face -->
    <path d="M100,-40 L100,60 L30,100 L30,0 Z" fill="#B8962E" opacity="0.04" stroke="#B8962E" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Box tape line -->
    <line x1="15" y1="-20" x2="15" y2="80" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
    <line x1="-20" y1="-10" x2="65" y2="-10" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
    <!-- Amazon-style curved arrow -->
    <g transform="translate(15, 30)">
      <path d="M-35,10 Q-20,-15 20,-10 Q40,-8 45,5" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
      <!-- Arrow head -->
      <polygon points="45,5 38,-2 50,0" fill="#D4AF37" opacity="0.6"/>
    </g>
  </g>
  <!-- Smaller boxes -->
  <g opacity="0.3">
    <g transform="translate(380, 340)">
      <path d="M-25,0 L0,-15 L35,-15 L35,25 L-25,25 Z" fill="none" stroke="#B8962E" stroke-width="0.8"/>
      <path d="M-25,0 L0,-15 L35,-15 L10,0 Z" fill="#B8962E" opacity="0.06" stroke="#B8962E" stroke-width="0.8"/>
    </g>
    <g transform="translate(740, 340)">
      <path d="M-20,0 L0,-12 L30,-12 L30,20 L-20,20 Z" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
      <path d="M-20,0 L0,-12 L30,-12 L10,0 Z" fill="#D4AF37" opacity="0.05" stroke="#D4AF37" stroke-width="0.6"/>
    </g>
  </g>
  <!-- Barcode-like lines -->
  <g transform="translate(700, 280)" opacity="0.2">
    <rect x="0" y="0" width="2" height="20" fill="#B8962E"/>
    <rect x="4" y="0" width="1" height="20" fill="#B8962E"/>
    <rect x="7" y="0" width="3" height="20" fill="#B8962E"/>
    <rect x="12" y="0" width="1" height="20" fill="#B8962E"/>
    <rect x="15" y="0" width="2" height="20" fill="#B8962E"/>
    <rect x="19" y="0" width="1" height="20" fill="#B8962E"/>
    <rect x="22" y="0" width="3" height="20" fill="#B8962E"/>
    <rect x="27" y="0" width="1" height="20" fill="#B8962E"/>
    <rect x="30" y="0" width="2" height="20" fill="#B8962E"/>
  </g>
  <!-- Shipping dots path -->
  <g opacity="0.15">
    <circle cx="300" cy="300" r="2" fill="#B8962E"/>
    <circle cx="330" cy="295" r="1.5" fill="#B8962E"/>
    <circle cx="360" cy="305" r="1.5" fill="#D4AF37"/>
    <circle cx="830" cy="310" r="2" fill="#B8962E"/>
    <circle cx="860" cy="305" r="1.5" fill="#D4AF37"/>
    <circle cx="890" cy="315" r="1.5" fill="#B8962E"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">FBA PREP</text>
  <rect x="560" y="575" width="80" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>