<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle horizontal lines -->
  <g opacity="0.025">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
  <!-- Building/warehouse shapes -->
  <g filter="url(#glow)">
    <!-- Main warehouse -->
    <g transform="translate(480, 180)">
      <!-- Roof -->
      <path d="M-80,60 L0,0 L80,60 Z" fill="#B8962E" opacity="0.06" stroke="#B8962E" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- Body -->
      <rect x="-70" y="60" width="140" height="100" fill="#B8962E" opacity="0.04" stroke="#B8962E" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Door -->
      <rect x="-15" y="110" width="30" height="50" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.35"/>
      <!-- Windows -->
      <rect x="-55" y="80" width="20" height="18" fill="none" stroke="#B8962E" stroke-width="0.6" opacity="0.3"/>
      <rect x="35" y="80" width="20" height="18" fill="none" stroke="#B8962E" stroke-width="0.6" opacity="0.3"/>
      <!-- Loading dock lines -->
      <line x1="-70" y1="130" x2="-90" y2="130" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
      <line x1="-90" y1="120" x2="-90" y2="160" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
    </g>
    <!-- Second building (smaller, office) -->
    <g transform="translate(720, 220)">
      <rect x="-40" y="0" width="80" height="120" fill="#B8962E" opacity="0.04" stroke="#B8962E" stroke-width="0.8" stroke-opacity="0.35"/>
      <!-- Windows grid -->
      <rect x="-30" y="15" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.25"/>
      <rect x="-10" y="15" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.25"/>
      <rect x="16" y="15" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.25"/>
      <rect x="-30" y="40" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
      <rect x="-10" y="40" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
      <rect x="16" y="40" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
      <rect x="-30" y="65" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.15"/>
      <rect x="-10" y="65" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.15"/>
      <rect x="16" y="65" width="14" height="12" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.15"/>
      <!-- Entrance -->
      <rect x="-10" y="95" width="20" height="25" fill="none" stroke="#B8962E" stroke-width="0.6" opacity="0.3"/>
    </g>
    <!-- Connection arrows between buildings -->
    <path d="M560,300 L660,280" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3" stroke-dasharray="6,4"/>
    <polygon points="660,280 652,275 654,285" fill="#D4AF37" opacity="0.3"/>
    <path d="M660,310 L560,330" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.25" stroke-dasharray="6,4"/>
    <polygon points="560,330 568,325 566,335" fill="#D4AF37" opacity="0.25"/>
    <!-- Ground line -->
    <line x1="300" y1="340" x2="900" y2="340" stroke="#B8962E" stroke-width="0.5" opacity="0.15"/>
    <!-- Small truck silhouette -->
    <g transform="translate(610, 320)" opacity="0.25">
      <rect x="0" y="-12" width="25" height="12" rx="1" fill="none" stroke="#B8962E" stroke-width="0.8"/>
      <rect x="25" y="-8" width="12" height="8" rx="1" fill="none" stroke="#B8962E" stroke-width="0.8"/>
      <circle cx="8" cy="3" r="3" fill="none" stroke="#B8962E" stroke-width="0.6"/>
      <circle cx="30" cy="3" r="3" fill="none" stroke="#B8962E" stroke-width="0.6"/>
    </g>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">B2B LOGISTICS</text>
  <rect x="540" y="575" width="120" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>