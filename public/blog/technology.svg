<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Circuit board pattern -->
  <g filter="url(#glow)">
    <!-- Central chip/processor -->
    <rect x="540" y="230" width="120" height="120" rx="4" fill="none" stroke="#B8962E" stroke-width="1.5" opacity="0.5"/>
    <rect x="560" y="250" width="80" height="80" rx="2" fill="#B8962E" opacity="0.06"/>
    <rect x="575" y="265" width="50" height="50" rx="1" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <!-- Chip pins - top -->
    <line x1="570" y1="230" x2="570" y2="200" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="590" y1="230" x2="590" y2="190" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="610" y1="230" x2="610" y2="200" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="630" y1="230" x2="630" y2="195" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <!-- Chip pins - bottom -->
    <line x1="570" y1="350" x2="570" y2="380" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="590" y1="350" x2="590" y2="395" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="610" y1="350" x2="610" y2="385" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="630" y1="350" x2="630" y2="375" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <!-- Chip pins - left -->
    <line x1="540" y1="260" x2="500" y2="260" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="540" y1="280" x2="490" y2="280" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="540" y1="300" x2="505" y2="300" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="540" y1="320" x2="495" y2="320" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <!-- Chip pins - right -->
    <line x1="660" y1="260" x2="700" y2="260" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="660" y1="280" x2="710" y2="280" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="660" y1="300" x2="695" y2="300" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <line x1="660" y1="320" x2="705" y2="320" stroke="#B8962E" stroke-width="1" opacity="0.4"/>
    <!-- Circuit traces -->
    <path d="M590,190 L590,170 L450,170 L450,260 L500,260" fill="none" stroke="#B8962E" stroke-width="0.8" opacity="0.25"/>
    <path d="M630,195 L630,160 L780,160 L780,260 L700,260" fill="none" stroke="#B8962E" stroke-width="0.8" opacity="0.25"/>
    <path d="M490,280 L460,280 L460,400 L570,400 L570,380" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.2"/>
    <path d="M710,280 L740,280 L740,410 L630,410 L630,375" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.2"/>
    <path d="M570,200 L570,180 L380,180 L380,320 L495,320" fill="none" stroke="#B8962E" stroke-width="0.6" opacity="0.15"/>
    <path d="M695,300 L720,300 L720,180 L850,180" fill="none" stroke="#B8962E" stroke-width="0.6" opacity="0.15"/>
    <path d="M505,300 L480,300 L480,430 L590,430 L590,395" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.15"/>
    <!-- Junction dots -->
    <circle cx="450" cy="260" r="3" fill="#B8962E" opacity="0.5"/>
    <circle cx="780" cy="260" r="3" fill="#B8962E" opacity="0.5"/>
    <circle cx="460" cy="400" r="2.5" fill="#D4AF37" opacity="0.4"/>
    <circle cx="740" cy="410" r="2.5" fill="#D4AF37" opacity="0.4"/>
    <circle cx="380" cy="320" r="2" fill="#B8962E" opacity="0.3"/>
    <circle cx="850" cy="180" r="2" fill="#B8962E" opacity="0.3"/>
    <circle cx="480" cy="430" r="2" fill="#D4AF37" opacity="0.3"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">TECHNOLOGY</text>
  <rect x="550" y="575" width="100" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>