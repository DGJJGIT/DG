<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Radial subtle lines -->
  <g opacity="0.03">
    <line x1="600" y1="300" x2="0" y2="0" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="1200" y2="0" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="0" y2="630" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="1200" y2="630" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="600" y2="0" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="0" y2="300" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="600" y1="300" x2="1200" y2="300" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
  <!-- Star/rating shapes -->
  <g filter="url(#glow)">
    <!-- Central large star -->
    <g transform="translate(600, 260)">
      <polygon points="0,-60 14,-20 56,-20 22,8 34,50 0,26 -34,50 -22,8 -56,-20 -14,-20" fill="#B8962E" opacity="0.15" stroke="#B8962E" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Inner glow -->
      <circle cx="0" cy="0" r="20" fill="#D4AF37" opacity="0.08"/>
    </g>
    <!-- Rating stars row -->
    <g transform="translate(420, 380)" opacity="0.5">
      <polygon points="0,-18 4,-6 17,-6 7,2 10,15 0,8 -10,15 -7,2 -17,-6 -4,-6" fill="#D4AF37" opacity="0.7"/>
    </g>
    <g transform="translate(470, 380)" opacity="0.5">
      <polygon points="0,-18 4,-6 17,-6 7,2 10,15 0,8 -10,15 -7,2 -17,-6 -4,-6" fill="#D4AF37" opacity="0.7"/>
    </g>
    <g transform="translate(520, 380)" opacity="0.5">
      <polygon points="0,-18 4,-6 17,-6 7,2 10,15 0,8 -10,15 -7,2 -17,-6 -4,-6" fill="#D4AF37" opacity="0.7"/>
    </g>
    <g transform="translate(570, 380)" opacity="0.5">
      <polygon points="0,-18 4,-6 17,-6 7,2 10,15 0,8 -10,15 -7,2 -17,-6 -4,-6" fill="#D4AF37" opacity="0.7"/>
    </g>
    <g transform="translate(620, 380)" opacity="0.5">
      <polygon points="0,-18 4,-6 17,-6 7,2 10,15 0,8 -10,15 -7,2 -17,-6 -4,-6" fill="#D4AF37" opacity="0.35"/>
    </g>
    <!-- Floating accent stars -->
    <g transform="translate(350, 200)" opacity="0.25">
      <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4" fill="#B8962E"/>
    </g>
    <g transform="translate(820, 230)" opacity="0.2">
      <polygon points="0,-10 2,-3 9,-3 4,1 6,8 0,4 -6,8 -4,1 -9,-3 -2,-3" fill="#D4AF37"/>
    </g>
    <g transform="translate(750, 350)" opacity="0.15">
      <polygon points="0,-8 2,-3 8,-3 3,1 5,7 0,4 -5,7 -3,1 -8,-3 -2,-3" fill="#B8962E"/>
    </g>
    <!-- Concentric circles around central star -->
    <circle cx="600" cy="260" r="90" fill="none" stroke="#B8962E" stroke-width="0.5" opacity="0.15"/>
    <circle cx="600" cy="260" r="120" fill="none" stroke="#B8962E" stroke-width="0.5" opacity="0.08"/>
    <circle cx="600" cy="260" r="150" fill="none" stroke="#D4AF37" stroke-width="0.3" opacity="0.05"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">CUSTOMER EXPERIENCE</text>
  <rect x="515" y="575" width="170" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>