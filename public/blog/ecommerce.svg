<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.03">
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  <!-- Shopping cart icon -->
  <g filter="url(#glow)" transform="translate(600, 270)">
    <!-- Cart body -->
    <path d="M-80,0 L-60,-60 L80,-60 L65,10 L-50,10 Z" fill="#B8962E" opacity="0.08" stroke="#B8962E" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Cart handle -->
    <path d="M-80,0 L-110,-10 L-120,-10" fill="none" stroke="#B8962E" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <!-- Cart lines -->
    <line x1="-70" y1="-40" x2="75" y2="-40" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <line x1="-65" y1="-20" x2="70" y2="-20" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <!-- Wheels -->
    <circle cx="-40" cy="30" r="10" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    <circle cx="-40" cy="30" r="3" fill="#D4AF37" opacity="0.4"/>
    <circle cx="50" cy="30" r="10" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    <circle cx="50" cy="30" r="3" fill="#D4AF37" opacity="0.4"/>
    <!-- Items in cart (abstract boxes) -->
    <rect x="-50" y="-55" width="30" height="30" rx="2" fill="#B8962E" opacity="0.12" stroke="#B8962E" stroke-width="0.5" stroke-opacity="0.3"/>
    <rect x="-10" y="-55" width="25" height="30" rx="2" fill="#D4AF37" opacity="0.08" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.25"/>
    <rect x="25" y="-55" width="35" height="30" rx="2" fill="#B8962E" opacity="0.1" stroke="#B8962E" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>
  <!-- Floating price tags / digital elements -->
  <g opacity="0.25">
    <rect x="340" y="160" width="40" height="25" rx="3" fill="none" stroke="#B8962E" stroke-width="0.8"/>
    <circle cx="348" cy="172" r="3" fill="none" stroke="#B8962E" stroke-width="0.5"/>
    <rect x="800" y="200" width="45" height="28" rx="3" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="808" cy="214" r="3" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <rect x="750" y="380" width="35" height="22" rx="3" fill="none" stroke="#B8962E" stroke-width="0.6"/>
    <circle cx="757" cy="391" r="2.5" fill="none" stroke="#B8962E" stroke-width="0.4"/>
  </g>
  <!-- Connecting dots (digital commerce flow) -->
  <g opacity="0.15">
    <circle cx="300" cy="250" r="2" fill="#B8962E"/>
    <circle cx="350" cy="280" r="1.5" fill="#D4AF37"/>
    <circle cx="850" cy="300" r="2" fill="#B8962E"/>
    <circle cx="880" cy="260" r="1.5" fill="#D4AF37"/>
    <circle cx="400" cy="400" r="1.5" fill="#B8962E"/>
    <circle cx="820" cy="380" r="2" fill="#D4AF37"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">ECOMMERCE</text>
  <rect x="550" y="575" width="100" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>