<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle cross pattern -->
  <g opacity="0.025">
    <pattern id="cross" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="20" y1="15" x2="20" y2="25" stroke="#FFFFFF" stroke-width="0.5"/>
      <line x1="15" y1="20" x2="25" y2="20" stroke="#FFFFFF" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#cross)"/>
  </g>
  <!-- Storefront shape -->
  <g filter="url(#glow)" transform="translate(600, 220)">
    <!-- Awning/canopy -->
    <path d="M-120,-30 L120,-30 L120,0 Q90,20 60,0 Q30,20 0,0 Q-30,20 -60,0 Q-90,20 -120,0 Z" fill="#B8962E" opacity="0.1" stroke="#B8962E" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Building facade -->
    <rect x="-120" y="0" width="240" height="140" fill="#B8962E" opacity="0.04" stroke="#B8962E" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Sign area -->
    <rect x="-80" y="-55" width="160" height="25" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.35"/>
    <!-- Window left -->
    <rect x="-105" y="20" width="70" height="80" rx="2" fill="#1A1A1A" stroke="#B8962E" stroke-width="0.8" opacity="0.4"/>
    <!-- Window shelves -->
    <line x1="-100" y1="50" x2="-40" y2="50" stroke="#B8962E" stroke-width="0.4" opacity="0.2"/>
    <line x1="-100" y1="75" x2="-40" y2="75" stroke="#B8962E" stroke-width="0.4" opacity="0.2"/>
    <!-- Window right -->
    <rect x="35" y="20" width="70" height="80" rx="2" fill="#1A1A1A" stroke="#B8962E" stroke-width="0.8" opacity="0.4"/>
    <line x1="40" y1="50" x2="100" y2="50" stroke="#B8962E" stroke-width="0.4" opacity="0.2"/>
    <line x1="40" y1="75" x2="100" y2="75" stroke="#B8962E" stroke-width="0.4" opacity="0.2"/>
    <!-- Door -->
    <rect x="-18" y="60" width="36" height="80" rx="2" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.45"/>
    <circle cx="12" cy="100" r="2.5" fill="#D4AF37" opacity="0.4"/>
    <!-- Door line -->
    <line x1="0" y1="60" x2="0" y2="140" stroke="#D4AF37" stroke-width="0.5" opacity="0.25"/>
    <!-- Roof line -->
    <line x1="-130" y1="-30" x2="130" y2="-30" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Decorative elements -->
  <g opacity="0.2">
    <!-- Shopping bag left -->
    <g transform="translate(360, 350)">
      <rect x="-12" y="0" width="24" height="28" rx="2" fill="none" stroke="#B8962E" stroke-width="0.8"/>
      <path d="M-6,-5 Q-6,-12 0,-12 Q6,-12 6,-5" fill="none" stroke="#B8962E" stroke-width="0.6"/>
    </g>
    <!-- Shopping bag right -->
    <g transform="translate(840, 320)">
      <rect x="-10" y="0" width="20" height="24" rx="2" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
      <path d="M-5,-4 Q-5,-10 0,-10 Q5,-10 5,-4" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    </g>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">RETAIL</text>
  <rect x="570" y="575" width="60" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>