<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B8962E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8962E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle dot grid -->
  <g opacity="0.05">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>
  <!-- Upward trending chart lines -->
  <g filter="url(#glow)">
    <!-- Area fill under main line -->
    <path d="M200,420 C300,400 350,380 420,350 C490,320 520,310 580,270 C640,230 680,220 740,190 C800,160 850,150 920,120 L920,480 L200,480 Z" fill="url(#goldFade)" opacity="0.3"/>
    <!-- Main trend line -->
    <path d="M200,420 C300,400 350,380 420,350 C490,320 520,310 580,270 C640,230 680,220 740,190 C800,160 850,150 920,120" fill="none" stroke="#B8962E" stroke-width="2.5" opacity="0.9"/>
    <!-- Secondary trend line -->
    <path d="M200,440 C300,430 380,420 440,400 C500,380 560,370 620,340 C680,310 730,300 800,280 C870,260 900,250 960,230" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
    <!-- Third trend line -->
    <path d="M200,460 C320,450 400,445 480,430 C560,415 600,410 680,390 C760,370 820,360 900,340" fill="none" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <!-- Data points on main line -->
    <circle cx="200" cy="420" r="4" fill="#B8962E" opacity="0.7"/>
    <circle cx="420" cy="350" r="4" fill="#B8962E" opacity="0.8"/>
    <circle cx="580" cy="270" r="5" fill="#D4AF37" opacity="0.9"/>
    <circle cx="740" cy="190" r="4" fill="#B8962E" opacity="0.8"/>
    <circle cx="920" cy="120" r="6" fill="#D4AF37" opacity="1"/>
    <circle cx="920" cy="120" r="10" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
    <!-- Horizontal grid lines -->
    <line x1="200" y1="480" x2="960" y2="480" stroke="#FFFFFF" stroke-width="0.5" opacity="0.06"/>
    <line x1="200" y1="400" x2="960" y2="400" stroke="#FFFFFF" stroke-width="0.5" opacity="0.04"/>
    <line x1="200" y1="320" x2="960" y2="320" stroke="#FFFFFF" stroke-width="0.5" opacity="0.04"/>
    <line x1="200" y1="240" x2="960" y2="240" stroke="#FFFFFF" stroke-width="0.5" opacity="0.04"/>
    <line x1="200" y1="160" x2="960" y2="160" stroke="#FFFFFF" stroke-width="0.5" opacity="0.04"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">INDUSTRY INSIGHTS</text>
  <rect x="530" y="575" width="140" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>