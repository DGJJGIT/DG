<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8962E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle circle pattern -->
  <g opacity="0.03">
    <circle cx="200" cy="150" r="100" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    <circle cx="900" cy="500" r="120" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    <circle cx="1000" cy="100" r="80" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
  <!-- Capsule shape -->
  <g filter="url(#glow)" transform="translate(600, 270) rotate(-20)">
    <!-- Main capsule -->
    <rect x="-100" y="-35" width="200" height="70" rx="35" fill="url(#capsuleGrad)" stroke="#B8962E" stroke-width="1.5" opacity="0.6"/>
    <!-- Dividing line -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#B8962E" stroke-width="1" opacity="0.5"/>
    <!-- Left half slightly different -->
    <path d="M0,-35 A35,35 0 0 0 0,35 L-65,35 A35,35 0 0 1 -100,0 A35,35 0 0 1 -65,-35 Z" fill="#B8962E" opacity="0.08"/>
    <!-- Highlight -->
    <ellipse cx="-40" cy="-15" rx="40" ry="8" fill="#FFFFFF" opacity="0.04" transform="rotate(-5)"/>
    <ellipse cx="50" cy="-15" rx="40" ry="8" fill="#FFFFFF" opacity="0.03" transform="rotate(-5)"/>
  </g>
  <!-- Molecular dots and connections -->
  <g filter="url(#glow)">
    <!-- Molecule cluster 1 -->
    <circle cx="380" cy="180" r="5" fill="#D4AF37" opacity="0.5"/>
    <circle cx="420" cy="160" r="3" fill="#B8962E" opacity="0.4"/>
    <circle cx="350" cy="200" r="4" fill="#B8962E" opacity="0.35"/>
    <circle cx="410" cy="210" r="3" fill="#D4AF37" opacity="0.3"/>
    <line x1="380" y1="180" x2="420" y2="160" stroke="#B8962E" stroke-width="0.8" opacity="0.3"/>
    <line x1="380" y1="180" x2="350" y2="200" stroke="#B8962E" stroke-width="0.8" opacity="0.3"/>
    <line x1="380" y1="180" x2="410" y2="210" stroke="#B8962E" stroke-width="0.8" opacity="0.25"/>
    <line x1="420" y1="160" x2="410" y2="210" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <!-- Molecule cluster 2 -->
    <circle cx="780" cy="350" r="4" fill="#B8962E" opacity="0.45"/>
    <circle cx="820" cy="330" r="3" fill="#D4AF37" opacity="0.4"/>
    <circle cx="810" cy="380" r="5" fill="#B8962E" opacity="0.35"/>
    <circle cx="760" cy="370" r="3" fill="#D4AF37" opacity="0.3"/>
    <circle cx="840" cy="360" r="2" fill="#B8962E" opacity="0.25"/>
    <line x1="780" y1="350" x2="820" y2="330" stroke="#B8962E" stroke-width="0.8" opacity="0.3"/>
    <line x1="780" y1="350" x2="810" y2="380" stroke="#B8962E" stroke-width="0.8" opacity="0.25"/>
    <line x1="820" y1="330" x2="840" y2="360" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <line x1="810" y1="380" x2="760" y2="370" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <!-- Scattered individual dots -->
    <circle cx="300" cy="300" r="2" fill="#B8962E" opacity="0.2"/>
    <circle cx="500" cy="400" r="2.5" fill="#D4AF37" opacity="0.15"/>
    <circle cx="700" cy="180" r="2" fill="#B8962E" opacity="0.2"/>
    <circle cx="850" cy="200" r="1.5" fill="#D4AF37" opacity="0.15"/>
    <circle cx="450" cy="350" r="2" fill="#B8962E" opacity="0.15"/>
    <circle cx="680" cy="420" r="1.5" fill="#D4AF37" opacity="0.12"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">SUPPLEMENTS</text>
  <rect x="545" y="575" width="110" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>