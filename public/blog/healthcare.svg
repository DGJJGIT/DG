<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8962E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8962E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle pulse/wave pattern -->
  <g opacity="0.04">
    <path d="M0,315 Q300,315 400,315 L430,280 L450,350 L470,260 L490,370 L510,300 L530,315 Q600,315 1200,315" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <!-- Shield shape -->
  <g filter="url(#glow)" transform="translate(600, 240)">
    <path d="M0,-90 L70,-60 L70,20 Q70,80 0,110 Q-70,80 -70,20 L-70,-60 Z" fill="url(#shieldGrad)" stroke="#B8962E" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Inner shield line -->
    <path d="M0,-70 L52,-46 L52,15 Q52,62 0,85 Q-52,62 -52,15 L-52,-46 Z" fill="none" stroke="#B8962E" stroke-width="0.5" opacity="0.2"/>
    <!-- Cross -->
    <rect x="-8" y="-40" width="16" height="60" rx="3" fill="#B8962E" opacity="0.4"/>
    <rect x="-25" y="-18" width="50" height="16" rx="3" fill="#B8962E" opacity="0.4"/>
    <!-- Cross inner highlight -->
    <rect x="-5" y="-37" width="10" height="54" rx="2" fill="#D4AF37" opacity="0.15"/>
    <rect x="-22" y="-15" width="44" height="10" rx="2" fill="#D4AF37" opacity="0.15"/>
  </g>
  <!-- Heartbeat line -->
  <g filter="url(#glow)" transform="translate(600, 420)">
    <path d="M-200,0 L-120,0 L-100,-20 L-80,25 L-60,-35 L-40,30 L-20,-10 L0,0 L200,0" fill="none" stroke="#B8962E" stroke-width="1" opacity="0.3"/>
    <!-- Pulse dot -->
    <circle cx="0" cy="0" r="3" fill="#D4AF37" opacity="0.5"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Subtle molecular/medical dots -->
  <g opacity="0.15">
    <circle cx="380" cy="220" r="2.5" fill="#B8962E"/>
    <circle cx="400" cy="190" r="2" fill="#D4AF37"/>
    <line x1="380" y1="220" x2="400" y2="190" stroke="#B8962E" stroke-width="0.5"/>
    <circle cx="820" cy="250" r="2" fill="#B8962E"/>
    <circle cx="845" cy="230" r="2.5" fill="#D4AF37"/>
    <line x1="820" y1="250" x2="845" y2="230" stroke="#B8962E" stroke-width="0.5"/>
    <circle cx="350" cy="350" r="1.5" fill="#D4AF37"/>
    <circle cx="850" cy="330" r="1.5" fill="#B8962E"/>
    <circle cx="440" cy="160" r="1.5" fill="#B8962E"/>
    <circle cx="760" cy="180" r="1.5" fill="#D4AF37"/>
  </g>
  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#A3A3A3">HEALTHCARE</text>
  <rect x="550" y="575" width="100" height="1" fill="url(#gold)" opacity="0.5"/>
</svg>